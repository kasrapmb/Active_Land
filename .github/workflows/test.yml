name: Application checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: activeland
          POSTGRES_USER: activeland
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U activeland" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_DEBUG: '1'
      POSTGRES_DB: activeland
      POSTGRES_USER: activeland
      POSTGRES_PASSWORD: ci-only-test-password
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # Template tests use manifest-backed static URLs even with the debug env set.
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test catalog portal enrollment
      - run: node --check catalog/static/catalog/app.js
