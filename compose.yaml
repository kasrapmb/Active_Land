services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: activeland
      POSTGRES_USER: activeland
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U activeland -d activeland"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    build: .
    image: activeland-web:local
    env_file: .env
    environment:
      POSTGRES_DB: activeland
      POSTGRES_USER: activeland
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TRUST_PROXY_HTTPS: '1'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    image: activeland-web:local
    env_file: .env
    environment:
      POSTGRES_DB: activeland
      POSTGRES_USER: activeland
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: [sh, -c, 'while :; do python manage.py process_enrollments; sleep 60; done']
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your domain}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
